[project]
name = "exchange-scraper-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PGCodifi", email = "piyushg@codifi.in" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=26.10.0",
    "bs4>=0.0.2",
    "cryptography>=50.0.2",
    "isort>=9.0.2",
    "kafka>=1.3.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "paramiko>=5.0.0",
    "psycopg>=3.3.6",
    "requests>=2.34.2",
    "selenium>=4.50.0",
]

[project.scripts]
exchange-scraper-automation = "exchange_scraper_automation:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
